name: Kernel Config - Samsung

permissions:
  contents: write  # Allow writing to repository contents
  actions: write   # Allows triggering actions

on:
  workflow_call:
    inputs:
      susfs:
        required: true
        type: string
      bbg:
        required: true
        type: string
      unicodefix:
        required: true
        type: string
      nomount:
        required: true
        type: string
      root_flavor:
        required: true
        type: string
      root_commit:
        required: false
        type: string
        default: 
      droidspace:
        required: true
        type: string
      ntsync:
        required: true
        type: string
      bbrv3:
        required: true
        type: string
      ipv6_nat:
        required: true
        type: string
      optimization:
        required: true
        type: string
      ttl:
        required: true
        type: string
      lto:
        required: true
        type: string

jobs:
  build-kernels-a12:
    name: "Samsung-${{ matrix.branch }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          # test cut: one android14-6.1 device, all root flavors via main.yml
          - branch: "SM-S928B-Oneui8"
            build_type: "Bazel"

    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      branch: ${{ matrix.branch }}
      build_type: ${{ matrix.build_type }}
      susfs: ${{ inputs.susfs }}
      bbg: ${{ inputs.bbg }}
      unicodefix: ${{ inputs.unicodefix }}
      nomount: ${{ inputs.nomount }}
      root_flavor: ${{ inputs.root_flavor }}
      root_commit: ${{ inputs.root_commit }}
      droidspace: ${{ inputs.droidspace }}
      ntsync: ${{ inputs.ntsync }}
      bbrv3: ${{ inputs.bbrv3 }}
      ipv6_nat: ${{ inputs.ipv6_nat }}
      optimization: ${{ inputs.optimization }}
      ttl: ${{ inputs.ttl }}
      lto: ${{ inputs.lto }}

